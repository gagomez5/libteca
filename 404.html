<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'; upgrade-insecure-requests">

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' rx='44' fill='%23241C2E'/%3E%3Crect x='39' y='80' width='34' height='70' rx='10' fill='%23E8543E'/%3E%3Crect x='83' y='56' width='34' height='94' rx='10' fill='%23F5A623'/%3E%3Crect x='127' y='68' width='34' height='82' rx='10' fill='%232FBF9F'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap">
<style>
  :root{
    --ink:#241C2E; --paper:#FFF8EC; --bg:#FBF0D9; --border:#E8D9AE;
    --coral:#E8543E; --coral-dark:#C23F2C;
    --amber:#F5A623; --amber-dark:#C57F12;
    --teal:#2FBF9F; --teal-dark:#1F9B80;
    --text:#241C2E; --text-muted:#6B6072;
    --font-sans:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
    --font-serif:'Bricolage Grotesque','Georgia','Times New Roman',serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;}
  h1,h2,.serif{font-family:var(--font-serif);}
  a{color:var(--coral);}

  header{background:var(--paper);padding:20px 16px;padding-top:calc(20px + env(safe-area-inset-top));border-bottom:1px solid var(--border);}
  .header-inner{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;}
  .brand h1{color:var(--ink);font-size:20px;margin:0;letter-spacing:.3px;}

  main{max-width:560px;margin:0 auto;padding:60px 16px;flex:1;display:flex;align-items:center;}
  .doc-card{background:var(--paper);border:1px solid var(--border);border-radius:16px;padding:40px 28px;text-align:center;width:100%;}
  .spines{display:flex;justify-content:center;gap:8px;margin-bottom:22px;}
  .spines rect{transition:none;}
  .doc-card .code{font-family:var(--font-serif);font-size:56px;font-weight:800;color:var(--ink);margin:0;letter-spacing:1px;}
  .doc-card h2{font-size:19px;color:var(--ink);margin:8px 0 10px;}
  .doc-card p{font-size:14.5px;color:var(--text-muted);margin:0 0 26px;}
  .btn{display:inline-block;background:var(--coral);color:#fff;font-weight:600;font-size:14.5px;text-decoration:none;padding:12px 26px;border-radius:10px;}
  .btn:hover{background:var(--coral-dark);}

  .legal-footer{max-width:760px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom));font-size:12.5px;color:var(--text-muted);display:flex;gap:8px 14px;flex-wrap:wrap;justify-content:center;text-align:center;}
  .legal-footer a{color:var(--text-muted);text-decoration:underline;}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="brand" href="/">
      <svg width="20" height="20" viewBox="0 0 200 200"><rect width="200" height="200" rx="44" fill="#241C2E"/><rect x="39" y="80" width="34" height="70" rx="10" fill="#E8543E"/><rect x="83" y="56" width="34" height="94" rx="10" fill="#F5A623"/><rect x="127" y="68" width="34" height="82" rx="10" fill="#2FBF9F"/></svg>
      <h1>Bruukion</h1>
    </a>
  </div>
</header>

<main>
  <div class="doc-card">
    <svg class="spines" width="90" height="40" viewBox="0 0 90 40"><rect x="0" y="4" width="17" height="35" rx="5" fill="#E8543E"/><rect x="21" y="0" width="17" height="39" rx="5" fill="#F5A623"/><rect x="42" y="8" width="17" height="31" rx="5" fill="#2FBF9F"/><rect x="63" y="2" width="17" height="37" rx="5" fill="#E8543E" opacity=".4"/></svg>
    <p class="code">404</p>
    <h2>Esta página no está en el estante</h2>
    <p>El enlace puede estar roto o la página fue movida. Volvamos a tu biblioteca.</p>
    <a class="btn" href="/">Ir a Bruukion</a>
  </div>
</main>

<footer class="legal-footer">
  <a href="/">Inicio</a>
  <a href="/pricing">Precios</a>
  <a href="/terms">Términos de servicio</a>
  <a href="/privacy">Política de privacidad</a>
</footer>

</body>
</html>
